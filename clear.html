<!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>إعادة تشغيل التطبيق</title>
    <style>
      body { font-family: Arial, sans-serif; display:flex; align-items:center; justify-content:center;
             min-height:100vh; margin:0; background:#f0f4ff; flex-direction:column; text-align:center; padding:20px; }
      h2 { color:#1d4ed8; margin-bottom:12px; }
      p  { color:#555; margin-bottom:8px; line-height:1.6; }
      .spinner { width:48px; height:48px; border:5px solid #dbeafe; border-top-color:#2563eb;
                 border-radius:50%; animation:spin 0.8s linear infinite; margin:20px auto; }
      @keyframes spin { to { transform:rotate(360deg); } }
      .done { color:#16a34a; font-weight:bold; font-size:1.1rem; display:none; }
    </style>
  </head>
  <body>
    <h2>جاري إعادة ضبط التطبيق...</h2>
    <div class="spinner" id="spin"></div>
    <p id="status">يتم حذف البيانات المؤقتة...</p>
    <p class="done" id="done">✅ تم! سيتم فتح التطبيق الآن...</p>
    <script>
      async function cleanup() {
        const status = document.getElementById('status');

        // 1. Unregister ALL service workers
        status.textContent = 'إلغاء Service Workers...';
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) { await r.unregister(); }
        }

        // 2. Clear ALL caches
        status.textContent = 'حذف الكاش...';
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) { await caches.delete(k); }
        }

        // 3. Done - redirect to app
        status.textContent = 'تم!';
        document.getElementById('spin').style.display = 'none';
        document.getElementById('done').style.display = 'block';

        setTimeout(() => {
          window.location.replace('./');
        }, 1500);
      }
      cleanup();
    </script>
  </body>
  </html>
